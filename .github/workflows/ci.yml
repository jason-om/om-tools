name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: 22
          cache: npm

      # package-lock.json is generated by npm 11. npm 10, which ships with
      # Node 22, rejects it: it insists `lru-cache` be present in the lock
      # even though it is an *optional* peer dependency of the `unstorage`
      # that `nitro` pulls in. npm 11 resolves this correctly.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm test` builds first, so this covers the build too.
      - name: Build and test
        run: npm test
